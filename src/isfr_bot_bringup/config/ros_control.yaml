controller_manager:
  ros__parameters:
    update_rate: 50
    use_sim_time: true

    # Controllers
    diffdrive_controller:
      type: diff_drive_controller/DiffDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_group_position_controller/JointGroupPositionController
      joints:
        - joint1
        - joint2
        - joint3
        - joint4
        - gripper_left_joint
        # Optional in simulation:
        - gripper_right_joint

diffdrive_controller:
  ros__parameters:
    use_sim_time: true
    left_wheel_names: ["wheel_left_joint"]
    right_wheel_names: ["wheel_right_joint"]
    publish_rate: 50.0
    pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 1000.0]
    twist_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 1000.0]
    wheel_separation: 0.160
    wheel_radius: 0.033

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true
    # No need to specify joints; it reads from URDF

arm_controller:
  ros__parameters:
    use_sim_time: true
    # Optional: tune joint limits, gains, etc., via ROS 2 control parameter overrides
