#VRML_SIM R2025a utf8

EXTERNPROTO "./turtlebot3_waffle_solid.proto"
EXTERNPROTO "./openmanipulator_x_solid.proto"

PROTO IsfrFullRobot [
  field SFVec3f translation 0 0 0
  field SFRotation rotation 0 0 1 0
  field SFString name "IsfrFullRobot"
  field SFString controller "<generic>"
  field MFString controllerArgs []
  field SFString customData ""
  field SFBool supervisor FALSE
  field SFBool synchronization TRUE
  field SFBool selfCollision FALSE
]
{
  Robot {
    translation IS translation
    rotation IS rotation
    name IS name
    controller IS controller
    controllerArgs IS controllerArgs
    customData IS customData
    supervisor IS supervisor
    synchronization IS synchronization
    selfCollision IS selfCollision

    children [
      # 1. De Waffle Base
      turtlebot3_waffle_solid {
        name "turtlebot3_waffle"
      }

      # 2. De Manipulator Arm (achterop)
      Transform {
        translation -0.14 0 0.1
        children [
          openmanipulator_x_solid {
            name "open_manipulator_x" 
          } 
        ] 
      }

      # 3. NIEUW: De Camera (voorop)
      Transform {
        # Positie: 0.1m naar voren (x), 0.2m hoog (z)
        translation 0.1 0 0.2 
        # Rotatie: Standaard kijkt Webots camera langs +X as (vooruit)
        rotation 0 0 1 0 
        children [
          Camera {
            # BELANGRIJK: Deze naam wordt deel van je topic: /isfr_bot/camera_sensor/image_raw
            name "camera_sensor" 
            fieldOfView 1.047  # 60 graden kijkhoek
            width 640          # Resolutie breedte
            height 480         # Resolutie hoogte
            near 0.1           # Ziet niets dichterbij dan 10cm
            far 10.0           # Ziet niets verder dan 10m
          }
          
          # Visueel blokje zodat je ziet waar de camera zit (zwart doosje)
          Shape {
            appearance PBRAppearance {
              baseColor 0.1 0.1 0.1
              metalness 0.5
              roughness 0.5
            }
            geometry Box {
              size 0.02 0.05 0.02
            }
          }
        ]
      }
    ]
  }
}