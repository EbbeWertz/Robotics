controller_manager:
  ros__parameters:
    update_rate: 50

    diffdrive_controller:
      type: diff_drive_controller/DiffDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    gripper_left_controller:
        type: position_controllers/GripperActionController
    gripper_right_controller:
        type: position_controllers/GripperActionController
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


diffdrive_controller:
  ros__parameters:
    publish_odom: false
    publish_odom_tf: false
    enable_odom_tf: false
    enable_odom_pub: false
    left_wheel_names: ["leftwheel_motor"]
    right_wheel_names: ["rightwheel_motor"]

    wheel_separation: 0.287
    wheel_radius: 0.033

    base_frame_id: base_link

    use_stamped_vel: false

    linear:
      x:
        max_velocity: 0.5

joint_state_broadcaster:
  ros__parameters:
    extra_joints:
      - lidar_sensor_secondary_motor
      - lidar_sensor_main_motor

gripper_left_controller:
    ros__parameters:
      joint: gripper_left_joint_motor

gripper_right_controller:
    ros__parameters:
      joint: gripper_right_joint_motor

arm_controller:
  ros__parameters:
    joints:
      - arm_orientation_motor
      - arm_shoulder_motor
      - arm_elbow_motor
      - arm_wrist_motor
    command_interfaces:
      - position
    state_interfaces:
      - position
    allow_partial_joints_goal: false
