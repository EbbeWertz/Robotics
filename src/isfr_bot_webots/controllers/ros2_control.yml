controller_manager:
  ros__parameters:
    update_rate: 50

    diffdrive_controller:
      type: diff_drive_controller/DiffDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

diffdrive_controller:
  ros__parameters:
    left_wheel_names: ["leftwheel_motor"]
    right_wheel_names: ["rightwheel_motor"]

    wheel_separation: 0.288
    wheel_radius: 0.033

    base_frame_id: base_link

    use_stamped_vel: false

joint_state_broadcaster:
  ros__parameters:
    extra_joints:
      - lidar_sensor_secondary_motor
      - lidar_sensor_main_motor